name: ci
permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile intelghost tests/test_intelghost.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI help smoke
        run: python ./intelghost --help
      - name: Real compiled Mach-O coverage smoke (macOS)
        if: runner.os == 'macOS'
        run: python tests/smoke_compiled.py
